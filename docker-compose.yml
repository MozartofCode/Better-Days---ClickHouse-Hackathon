services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodbank}
      POSTGRES_USER: ${POSTGRES_USER:-foodbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodbank}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-foodbank}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  librechat-mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - librechat_mongo_data:/data/db

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    restart: unless-stopped
    depends_on:
      - librechat-mongo
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: ${LIBRECHAT_MONGO_URI:-mongodb://librechat-mongo:27017/LibreChat}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:-change_me_to_a_long_random_string}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:-change_me_to_a_long_random_string}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:-}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ALLOW_REGISTRATION: "true"
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-foodbank}
      POSTGRES_USER: ${POSTGRES_USER:-foodbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      CLICKHOUSE_HOST: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-foodbank}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change_me}
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LIBRECHAT_SERVICE_API_KEY: ${LIBRECHAT_SERVICE_API_KEY:-change_me_to_a_long_random_string}
      FEEDINGAMERICA_API_KEY: ${FEEDINGAMERICA_API_KEY:-}
      FEEDINGAMERICA_BASE_URL: ${FEEDINGAMERICA_BASE_URL:-https://api.parse.bot/scraper/dcbc6656-4d7d-4ca1-bc88-673b8184b594}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ./api/src:/app/src
    command: npm run dev

volumes:
  postgres_data:
  clickhouse_data:
  librechat_mongo_data:
